[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-intelligence-platform"
version = "1.0.0"
description = "Explainable ML platform for EV battery State of Health and Remaining Useful Life prognostics."
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
