name: CI

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run smoke test
        run: python scripts/smoke_test.py

      - name: Validate Streamlit entrypoint
        run: python -c "import app; print('Entrypoint import passed')"
